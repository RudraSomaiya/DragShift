[project]
name = "dragshift"
version = "0.1.0.dev0"
description = "Drag a file, tap a key, and a wheel converts it or runs a tool on it. Windows only."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    # UI process (must stay lean, see CLAUDE.md rule 2)
    "PySide6-Essentials>=6.8",
    "pywin32",
    # Engines (imported by worker functions only)
    "Pillow>=11",
    "pillow-heif",
    "PyMuPDF",
    "pdf2docx",
    "pymupdf4llm",
    "python-pptx",
    "pypandoc-binary",
    "imageio-ffmpeg",
    "pandas",
    "openpyxl",
    "odfpy",
    "xlrd",
    "pysubs2",
    "send2trash",
]

[project.scripts]
dragshift = "dragshift.__main__:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-qt",
    "pre-commit",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff 0.17 also formats code blocks in Markdown; leave the PRD interfaces alone.
extend-exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
